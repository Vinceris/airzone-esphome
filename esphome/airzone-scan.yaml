# Modbus scan firmware (read-only), see az_scan.h.
# Use it only if airzone.yaml gets no answer from the central: it cycles through
# baud rates, parities and slave addresses 1-10, sending a read of register 0
# (function 03) and logging any byte that comes back.
# The node name matches airzone.yaml, so you can switch between the two over OTA.
substitutions:
  name: airzone
  friendly_name: Airzone
  tx_pin: GPIO16
  rx_pin: GPIO17

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  includes:
    - az_scan.h

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${friendly_name} Fallback
    password: !secret ap_password

captive_portal:

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

uart:
  id: rs485
  tx_pin: ${tx_pin}
  rx_pin: ${rx_pin}
  baud_rate: 19200
  data_bits: 8
  parity: EVEN
  stop_bits: 1

text_sensor:
  - platform: template
    id: scan_res
    name: Modbus scan
    update_interval: never

interval:
  - interval: 300ms
    then:
      - lambda: |-
          int c, a;
          azscan::tick(id(rs485), &c, &a);
  - interval: 20s
    then:
      - lambda: |-
          id(scan_res).publish_state(azscan::summary());
